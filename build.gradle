plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.weaverlib'
version = '0.2.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    maven { url = "https://maven.theillusivec4.top/"; content { includeGroup "top.theillusivec4.curios" } }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly 'maven.modrinth:embers-re-ignited:1.21.1-1.5.9'
    implementation 'curse.maven:thaumaturge-1628024:9452543'
    compileOnly "curse.maven:goety-586095:9207885"
    runtimeOnly 'maven.modrinth:lithostitched:1.8.0-neoforge-21.1'
    implementation 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
}

neoForge {
    version = '21.1.256'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        weaverlib { sourceSet sourceSets.main }
    }
}

tasks.named('jar') {
    from('LICENSE')
}

// Standalone rule tests exercise progression and transactional energy payments without a game bootstrap.
tasks.register('angelRulesTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java.toolchain.languageVersion
    }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'AngelRulesTest'
}
tasks.named('check') {
    dependsOn tasks.named('angelRulesTest')
}
